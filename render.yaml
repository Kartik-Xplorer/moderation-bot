services:
  # Main bot service
  - type: web
    name: masti-robot
    runtime: docker
    dockerfilePath: ./docker/alpine
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MESSAGE_DUMP
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: masti-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: masti-redis
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: HTTP_PORT
        value: "10000"

  # Redis service
  - type: redis
    name: masti-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Allow all internal services

databases:
  - name: masti-db
    plan: free
    databaseName: masti_robot
